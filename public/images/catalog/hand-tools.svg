      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F4F7FA"/>
      <stop offset="1" stop-color="#E6ECF3"/>
    </linearGradient>
    <pattern id="grid-handtools" width="32" height="32" patternUnits="userSpaceOnUse">
